name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Icon olustur
        run: |
          mkdir -p src/main/resources/assets/elytra_model
          base64 -d icon.b64 > src/main/resources/assets/elytra_model/icon.png
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: elytra-model
          path: build/libs/*.jar
